<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Tiny Beans">
  <!--
    Traced from the original bean mark, then smoothed: the outline is a
    band-limited polar curve (8 harmonics) emitted as a C1 bezier spline with
    exact tangents, so the curvature never kinks. The crease is a least-squares
    cubic through the centreline of the original's inner stroke, which carries
    a real bow off its chord, then trimmed to 76% of its length by de Casteljau
    subdivision and bowed further to a sagitta of 1.27 so it echoes the curve of
    the outer edge rather than cutting across it, then shifted 0.5 away from the
    outline. Its stroke is lighter than the rim's, which also widens the gap:
    edge to edge they now clear each other by 2.37 at the closest point.

    Filled brand olive with a beige rim, on a transparent background. The fill
    carries the mark on any tab colour, so unlike the stroke-only version this
    needs no light/dark switch.
  -->
  <path d="M51.10 32.45 C53.40 35.07 54.18 38.60 53.47 41.74 C52.75 44.89 50.77 47.71 48.14 49.57 C45.52 51.43 42.30 52.26 39.33 52.51 C36.35 52.76 33.57 52.57 31.02 51.94 C28.46 51.30 26.20 50.16 24.20 48.89 C22.21 47.62 20.41 46.25 18.82 44.64 C17.24 43.03 15.91 41.21 14.64 39.23 C13.38 37.24 12.17 35.02 11.35 32.45 C10.54 29.87 10.07 26.95 10.25 23.84 C10.43 20.74 11.44 17.43 13.60 15.03 C15.75 12.62 18.92 11.17 22.16 11.07 C25.40 10.97 28.68 12.35 31.02 14.62 C33.35 16.90 34.61 19.68 35.58 21.42 C36.55 23.16 37.42 24.09 38.47 24.99 C39.52 25.90 40.74 26.57 43.04 27.47 C45.34 28.36 48.80 29.82 51.10 32.45 Z"
        fill="#6c6e53" stroke="#ede1d1" stroke-width="3.2" stroke-linejoin="round"/>
  <path d="M30.12 22.82 C31.08 26.38 33.29 28.99 36.78 30.28"
        fill="none" stroke="#ede1d1" stroke-width="2.6" stroke-linecap="round"/>
</svg>
